version: "3"
services:
  cae-run:
    build: .
    container_name: cae-run
    image: cae-agent:v1.0.0
    command: ["python", "-m", "uvicorn", "main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ${CAE_ENV_FILE:-.env}
    environment:
      CAE_DATABASE_PATH: /opt/cae_service/workspace/guie.db
      CAE_WORKSPACE_ROOT: /opt/cae_service/workspace
      CAE_SERVICE_LOG_ROOT: /opt/cae_service/workspace/logs
      # Callers fetch the cloud images from this prefix, so it must be an address they can reach -
      # never 0.0.0.0 (a listen-only address) and never 127.0.0.1 (loopback, this host only).
      CAE_PUBLIC_BASE_URL: ${CAE_PUBLIC_BASE_URL:-http://192.168.16.128:8000}
      # VTK needs Mesa's libGL, which is not on the loader's default path. Host SSTA_CAE_PATH is
      # mounted at /opt/ssta-cae, so the library directory below is the container-side equivalent
      # of "<SSTA_CAE_PATH>/mesa/lib". Adjust if the layout on the CAE host differs.
      LD_LIBRARY_PATH: /opt/ssta-cae/mesa/lib
    volumes:
      - ${WORKSPACE}:/opt/cae_service/workspace
      - ${SSTA_CAE_PATH}:/opt/ssta-cae
    ports:
      - "0.0.0.0:8000:8000"
    restart: always
    stop_grace_period: 45s

  worker:
    build: .
    container_name: cae-worker
    image: cae-worker:v1.0.0
    command: ["python", "worker.py"]
    env_file: ${CAE_ENV_FILE:-.env}
    environment:
      CAE_DATABASE_PATH: /opt/cae_service/workspace/guie.db
      CAE_WORKSPACE_ROOT: /opt/cae_service/workspace
      CAE_SERVICE_LOG_ROOT: /opt/cae_service/workspace/logs
      CAE_GUIERUNNER_PATH: ${CAE_GUIERUNNER_PATH:-}
      # The Worker renders the cloud images, so libGL must be reachable from this container too.
      LD_LIBRARY_PATH: /opt/ssta-cae/mesa/lib
    volumes:
      - ${WORKSPACE}:/opt/cae_service/workspace
      - ${SSTA_CAE_PATH}:/opt/ssta-cae
    restart: always
    stop_grace_period: 45s
