[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
# services/scripts/ 下是脚本提供方交付的流程代码，不套用本项目的风格规则。
exclude = ["services/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 File/Form/Query 默认值必须写在参数默认值里，B008 在这里是误报。
"api/routes/*.py" = ["B008"]
